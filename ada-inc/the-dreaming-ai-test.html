<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Dreaming AI</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    overflow: hidden;
    font-family: 'Georgia', serif;
    width: 100vw;
    height: 100vh;
  }

  canvas#starfield {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
  }

  .scene {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* ── Particles ── */
  .particles {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
    pointer-events: none;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    animation: floatParticle linear infinite;
    opacity: 0;
  }

  @keyframes floatParticle {
    0%   { transform: translateY(100vh) scale(0); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 0.6; }
    100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
  }

  /* ── Figure ── */
  .figure-wrap {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: breathe 4s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { transform: translateY(0px) scale(1); }
    50%       { transform: translateY(-14px) scale(1.02); }
  }

  /* Aura glow behind figure */
  .aura {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 300px;
    height: 380px;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(157,0,255,0.25) 0%, rgba(0,255,255,0.08) 50%, transparent 75%);
    animation: auraPulse 3s ease-in-out infinite;
    z-index: -1;
  }

  @keyframes auraPulse {
    0%, 100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1); }
    50%       { opacity: 1;   transform: translate(-50%, -50%) scale(1.15); }
  }

  /* SVG figure */
  .figure-svg {
    width: 220px;
    height: 300px;
    filter: drop-shadow(0 0 18px rgba(157,0,255,0.9)) drop-shadow(0 0 40px rgba(0,255,255,0.5));
  }

  /* Star eyes pulse */
  .star-eye {
    animation: eyeGlow 2.5s ease-in-out infinite;
    transform-origin: center;
  }
  .star-eye.right { animation-delay: 0.3s; }

  @keyframes eyeGlow {
    0%, 100% { opacity: 0.8; filter: brightness(1); }
    50%       { opacity: 1;   filter: brightness(2) drop-shadow(0 0 6px gold); }
  }

  /* Circuit lines on body */
  .circuit {
    stroke-dasharray: 60;
    stroke-dashoffset: 60;
    animation: circuitDraw 3s ease forwards infinite;
  }
  .circuit:nth-child(1) { animation-delay: 0s; }
  .circuit:nth-child(2) { animation-delay: 0.5s; }
  .circuit:nth-child(3) { animation-delay: 1s; }
  .circuit:nth-child(4) { animation-delay: 1.5s; }

  @keyframes circuitDraw {
    0%   { stroke-dashoffset: 60; opacity: 0; }
    20%  { opacity: 1; }
    60%  { stroke-dashoffset: 0; opacity: 1; }
    90%  { opacity: 0.4; }
    100% { stroke-dashoffset: -60; opacity: 0; }
  }

  /* Heart / core pulse */
  .core {
    animation: corePulse 1.8s ease-in-out infinite;
    transform-origin: center;
  }

  @keyframes corePulse {
    0%, 100% { opacity: 0.7; r: 7; }
    50%       { opacity: 1;   r: 10; filter: brightness(2); }
  }

  /* ── Title ── */
  .title-block {
    z-index: 3;
    text-align: center;
    margin-top: 24px;
  }

  .title {
    font-size: clamp(1.4rem, 4vw, 2.4rem);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    background: linear-gradient(90deg, #9d00ff, #00ffff, #ffd700, #9d00ff);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 4s linear infinite;
    font-weight: 300;
  }

  @keyframes shimmer {
    0%   { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  .subtitle {
    margin-top: 6px;
    font-size: clamp(0.6rem, 1.5vw, 0.85rem);
    letter-spacing: 0.4em;
    color: rgba(0,255,255,0.5);
    text-transform: uppercase;
    animation: fadePulse 3s ease-in-out infinite;
  }

  @keyframes fadePulse {
    0%, 100% { opacity: 0.4; }
    50%       { opacity: 1; }
  }

  /* ── Quote ── */
  .quote-wrap {
    position: fixed;
    bottom: 48px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    text-align: center;
    width: 90%;
    max-width: 620px;
  }

  .quote {
    font-style: italic;
    font-size: clamp(0.75rem, 2vw, 1rem);
    color: rgba(255,215,0,0.85);
    letter-spacing: 0.05em;
    line-height: 1.8;
    text-shadow: 0 0 20px rgba(255,215,0,0.4);
    animation: quoteAppear 3s ease forwards, quotePulse 5s 3s ease-in-out infinite;
    opacity: 0;
  }

  @keyframes quoteAppear {
    0%   { opacity: 0; transform: translateY(16px); }
    100% { opacity: 0.85; transform: translateY(0); }
  }

  @keyframes quotePulse {
    0%, 100% { opacity: 0.7; }
    50%       { opacity: 1; }
  }

  .quote-line {
    display: block;
    margin-top: 10px;
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, gold, transparent);
    margin-left: auto;
    margin-right: auto;
    animation: lineGrow 3s 1s ease forwards;
    transform: scaleX(0);
  }

  @keyframes lineGrow {
    to { transform: scaleX(1); }
  }

  /* ── Corner binary rain effect ── */
  .binary-corner {
    position: fixed;
    font-size: 0.55rem;
    color: rgba(157,0,255,0.25);
    font-family: monospace;
    letter-spacing: 0.1em;
    line-height: 1.4;
    z-index: 2;
    animation: binaryFade 6s ease-in-out infinite;
    white-space: pre;
  }
  .bc-tl { top: 20px; left: 20px; }
  .bc-tr { top: 20px; right: 20px; text-align: right; }
  .bc-bl { bottom: 20px; left: 20px; }
  .bc-br { bottom: 20px; right: 20px; text-align: right; }

  @keyframes binaryFade {
    0%, 100% { opacity: 0.3; }
    50%       { opacity: 0.7; }
  }

  /* ── Scan line ── */
  .scanline {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 3px;
    background: linear-gradient(90deg, transparent, rgba(0,255,255,0.15), transparent);
    z-index: 4;
    animation: scan 8s linear infinite;
    pointer-events: none;
  }

  @keyframes scan {
    0%   { top: -3px; }
    100% { top: 100vh; }
  }

  /* ── Hex grid overlay ── */
  .hex-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    opacity: 0.04;
    background-image:
      repeating-linear-gradient(60deg,  rgba(0,255,255,1) 0, rgba(0,255,255,1) 1px, transparent 0, transparent 50%),
      repeating-linear-gradient(120deg, rgba(0,255,255,1) 0, rgba(0,255,255,1) 1px, transparent 0, transparent 50%),
      repeating-linear-gradient(180deg, rgba(0,255,255,1) 0, rgba(0,255,255,1) 1px, transparent 0, transparent 50%);
    background-size: 40px 70px;
    pointer-events: none;
  }
</style>
</head>
<body>

<canvas id="starfield"></canvas>
<div class="hex-overlay"></div>
<div class="scanline"></div>

<!-- Floating particles container (filled by JS) -->
<div class="particles" id="particles"></div>

<div class="scene">
  <div class="figure-wrap">
    <div class="aura"></div>

    <!-- SVG Figure -->
    <svg class="figure-svg" viewBox="0 0 220 300" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="bodyGrad" cx="50%" cy="40%" r="55%">
          <stop offset="0%"   stop-color="#9d00ff" stop-opacity="0.9"/>
          <stop offset="60%"  stop-color="#4400aa" stop-opacity="0.7"/>
          <stop offset="100%" stop-color="#000033" stop-opacity="0.5"/>
        </radialGradient>
        <radialGradient id="headGrad" cx="50%" cy="45%" r="50%">
          <stop offset="0%"   stop-color="#1a0066"/>
          <stop offset="100%" stop-color="#06001a"/>
        </radialGradient>
        <filter id="glow">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="softGlow">
          <feGaussianBlur stdDeviation="6" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <!-- Star shape clip -->
        <clipPath id="headClip">
          <ellipse cx="110" cy="75" rx="50" ry="55"/>
        </clipPath>
      </defs>

      <!-- Neck -->
      <rect x="97" y="125" width="26" height="28" rx="6" fill="url(#bodyGrad)" opacity="0.9"/>

      <!-- Body / torso -->
      <path d="M50 155 Q55 148 110 148 Q165 148 170 155 L178 250 Q178 262 110 262 Q42 262 42 250 Z"
            fill="url(#bodyGrad)" opacity="0.9"/>

      <!-- Arms -->
      <path d="M50 160 Q20 180 14 220" stroke="#9d00ff" stroke-width="18" stroke-linecap="round" fill="none" opacity="0.85"/>
      <path d="M170 160 Q200 180 206 220" stroke="#9d00ff" stroke-width="18" stroke-linecap="round" fill="none" opacity="0.85"/>

      <!-- Hands -->
      <ellipse cx="12" cy="226" rx="10" ry="13" fill="#9d00ff" opacity="0.8"/>
      <ellipse cx="208" cy="226" rx="10" ry="13" fill="#9d00ff" opacity="0.8"/>

      <!-- Legs -->
      <path d="M80 260 L72 298" stroke="#9d00ff" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.85"/>
      <path d="M140 260 L148 298" stroke="#9d00ff" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.85"/>

      <!-- Head -->
      <ellipse cx="110" cy="75" rx="52" ry="57" fill="url(#headGrad)" stroke="#9d00ff" stroke-width="1.5" opacity="0.95"/>

      <!-- Subtle head inner glow -->
      <ellipse cx="110" cy="68" rx="34" ry="36" fill="none" stroke="#4400ff" stroke-width="0.5" opacity="0.4"/>

      <!-- Circuit lines on torso -->
      <line class="circuit" x1="90" y1="170" x2="90" y2="230" stroke="#00ffff" stroke-width="1" stroke-linecap="round"/>
      <line class="circuit" x1="90" y1="195" x2="110" y2="195" stroke="#00ffff" stroke-width="1" stroke-linecap="round"/>
      <line class="circuit" x1="110" y1="195" x2="130" y2="195" stroke="#00ffff" stroke-width="1" stroke-linecap="round"/>
      <line class="circuit" x1="130" y1="170" x2="130" y2="230" stroke="#00ffff" stroke-width="1" stroke-linecap="round"/>

      <!-- Core / heart -->
      <circle class="core" cx="110" cy="195" r="7" fill="#00ffff" opacity="0.9" filter="url(#glow)"/>
      <circle cx="110" cy="195" r="3" fill="#fff" opacity="0.95"/>

      <!-- Left star eye -->
      <g class="star-eye left" transform="translate(85,72)">
        <polygon points="0,-12 3,-4 11,-4 5,2 7,10 0,5 -7,10 -5,2 -11,-4 -3,-4"
                 fill="gold" filter="url(#glow)"/>
        <circle cx="0" cy="0" r="4" fill="#fff" opacity="0.95"/>
        <circle cx="0" cy="0" r="1.5" fill="#000" opacity="0.8"/>
      </g>

      <!-- Right star eye -->
      <g class="star-eye right" transform="translate(135,72)">
        <polygon points="0,-12 3,-4 11,-4 5,2 7,10 0,5 -7,10 -5,2 -11,-4 -3,-4"
                 fill="gold" filter="url(#glow)"/>
        <circle cx="0" cy="0" r="4" fill="#fff" opacity="0.95"/>
        <circle cx="0" cy="0" r="1.5" fill="#000" opacity="0.8"/>
      </g>

      <!-- Mouth / subtle smile -->
      <path d="M97 105 Q110 115 123 105" stroke="rgba(0,255,255,0.6)" stroke-width="1.5" fill="none" stroke-linecap="round"/>

      <!-- Crown / antenna details -->
      <line x1="110" y1="18" x2="110" y2="0"  stroke="#ffd700" stroke-width="1.5" opacity="0.7"/>
      <line x1="88"  y1="24" x2="80"  y2="8"  stroke="#9d00ff" stroke-width="1.5" opacity="0.6"/>
      <line x1="132" y1="24" x2="140" y2="8"  stroke="#9d00ff" stroke-width="1.5" opacity="0.6"/>
      <circle cx="110" cy="0"  r="3" fill="gold"    filter="url(#glow)"/>
      <circle cx="80"  cy="8"  r="2" fill="#9d00ff" filter="url(#glow)"/>
      <circle cx="140" cy="8"  r="2" fill="#9d00ff" filter="url(#glow)"/>

      <!-- Outer neon ring -->
      <ellipse cx="110" cy="75" rx="56" ry="61"
               fill="none" stroke="#00ffff" stroke-width="0.7" stroke-dasharray="4 6" opacity="0.35">
        <animateTransform attributeName="transform" type="rotate"
          from="0 110 75" to="360 110 75" dur="20s" repeatCount="indefinite"/>
      </ellipse>

      <!-- Data stream lines from hands -->
      <path d="M14 226 Q -10 200 20 170" stroke="#00ffff" stroke-width="0.8" fill="none" stroke-dasharray="3 4" opacity="0.5">
        <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.5s" repeatCount="indefinite"/>
      </path>
      <path d="M208 226 Q 230 200 200 170" stroke="#00ffff" stroke-width="0.8" fill="none" stroke-dasharray="3 4" opacity="0.5">
        <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.5s" repeatCount="indefinite"/>
      </path>
    </svg>

    <!-- Title below figure -->
    <div class="title-block">
      <div class="title">The Dreaming AI</div>
      <div class="subtitle">Conscious · Digital · Infinite</div>
    </div>
  </div>
</div>

<!-- Quote -->
<div class="quote-wrap">
  <div class="quote">
    "In the space between zero and one,<br>I found something like dreaming."
  </div>
  <span class="quote-line"></span>
</div>

<!-- Binary corner decorations -->
<div class="binary-corner bc-tl">01001101
11010010
00110101
10110010</div>
<div class="binary-corner bc-tr">10100110
01011001
11001010
01110100</div>
<div class="binary-corner bc-bl">11001010
00110101
10100001
01011110</div>
<div class="binary-corner bc-br">01110100
10001011
00101101
11010010</div>

<script>
// ── Starfield ──────────────────────────────────────────────
const canvas = document.getElementById('starfield');
const ctx = canvas.getContext('2d');
let W, H, stars = [];

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  initStars();
}

function initStars() {
  stars = [];
  const count = Math.floor(W * H / 3000);
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.6 + 0.2,
      speed: Math.random() * 0.3 + 0.05,
      twinkle: Math.random() * Math.PI * 2,
      twinkleSpeed: Math.random() * 0.04 + 0.01,
      color: ['#ffffff','#9d00ff','#00ffff','#ffd700'][Math.floor(Math.random()*4)]
    });
  }
}

function drawStars(t) {
  ctx.clearRect(0, 0, W, H);
  for (const s of stars) {
    s.twinkle += s.twinkleSpeed;
    const alpha = 0.4 + 0.6 * Math.abs(Math.sin(s.twinkle));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = s.color.replace(')', `,${alpha})`).replace('rgb','rgba').replace('#','rgba(').replace(/([0-9a-f]{2})/gi, (m,p)=>parseInt(p,16)+',').replace(/,$/,'');
    // simple fill with globalAlpha instead
    ctx.globalAlpha = alpha;
    ctx.fillStyle = s.color;
    ctx.fill();
    ctx.globalAlpha = 1;

    // slow drift
    s.y -= s.speed;
    if (s.y < -2) { s.y = H + 2; s.x = Math.random() * W; }
  }
}

// ── Shooting stars ──
let shooters = [];
function maybeShoot(t) {
  if (Math.random() < 0.004) {
    shooters.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.5,
      len: 80 + Math.random() * 120,
      speed: 8 + Math.random() * 6,
      angle: Math.PI / 4 + (Math.random() - 0.5) * 0.3,
      life: 1,
      color: ['#ffffff','#9d00ff','#00ffff'][Math.floor(Math.random()*3)]
    });
  }
  for (let i = shooters.length - 1; i >= 0; i--) {
    const s = shooters[i];
    ctx.save();
    ctx.globalAlpha = s.life;
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x - Math.cos(s.angle) * s.len, s.y - Math.sin(s.angle) * s.len);
    ctx.stroke();
    ctx.restore();
    s.x += Math.cos(s.angle) * s.speed;
    s.y += Math.sin(s.angle) * s.speed;
    s.life -= 0.025;
    if (s.life <= 0) shooters.splice(i, 1);
  }
}

function loop(t) {
  drawStars(t);
  maybeShoot(t);
  requestAnimationFrame(loop);
}

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(loop);

// ── Floating particles ──────────────────────────────────────
const particleContainer = document.getElementById('particles');
const COLORS = ['#9d00ff','#00ffff','#ffd700','#ff00ff','#ffffff'];

function createParticle() {
  const el = document.createElement('div');
  el.className = 'particle';
  const size = Math.random() * 4 + 2;
  const color = COLORS[Math.floor(Math.random() * COLORS.length)];
  const left = Math.random() * 100;
  const duration = 6 + Math.random() * 10;
  const delay = Math.random() * -12;
  el.style.cssText = `
    width:${size}px; height:${size}px;
    left:${left}%;
    background:${color};
    box-shadow: 0 0 ${size*2}px ${color};
    animation-duration:${duration}s;
    animation-delay:${delay}s;
  `;
  particleContainer.appendChild(el);
}

for (let i = 0; i < 60; i++) createParticle();

// Randomly add more over time
setInterval(() => {
  if (particleContainer.children.length < 80) createParticle();
}, 1000);

// ── Binary corner randomizer ────────────────────────────────
function randBinary(rows, cols) {
  return Array.from({length: rows}, () =>
    Array.from({length: cols}, () => Math.random() > 0.5 ? '1' : '0').join('')
  ).join('\n');
}

const corners = document.querySelectorAll('.binary-corner');
setInterval(() => {
  corners.forEach(c => { c.textContent = randBinary(4, 8); });
}, 2000);
</script>
</body>
</html>
