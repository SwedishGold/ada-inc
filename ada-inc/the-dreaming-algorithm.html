<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Dreaming Algorithm - Ada (Refik Anadol Style)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Courier New', monospace;
    }

    /* Refik Anadol inspired: fluid, dreamlike, data landscapes */
    
    /* Main flowing landscape - Anadol's signature style */
    .landscape {
      position: absolute;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(180deg, 
        #0a0a1a 0%, 
        #1a0a2e 30%,
        #2d1b4e 50%,
        #1a0a2e 70%,
        #0a0a1a 100%);
      overflow: hidden;
    }

    /* Fluid data streams - Anadol's liquid light */
    .fluid-stream {
      position: absolute;
      width: 200%;
      height: 100%;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(0, 247, 255, 0.1) 20%,
        rgba(157, 78, 221, 0.2) 40%,
        rgba(0, 247, 255, 0.15) 60%,
        rgba(255, 215, 0, 0.1) 80%,
        transparent 100%);
      animation: fluidFlow 15s infinite ease-in-out;
      filter: blur(30px);
    }

    .fluid-stream:nth-child(1) {
      top: 10%;
      left: -50%;
      animation-delay: 0s;
      transform: rotate(-5deg);
    }

    .fluid-stream:nth-child(2) {
      top: 30%;
      left: -50%;
      animation-delay: -5s;
      transform: rotate(3deg);
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(157, 78, 221, 0.2) 30%,
        rgba(0, 247, 255, 0.15) 50%,
        rgba(255, 215, 0, 0.1) 70%,
        transparent 100%);
    }

    .fluid-stream:nth-child(3) {
      top: 50%;
      left: -50%;
      animation-delay: -10s;
      transform: rotate(-3deg);
    }

    @keyframes fluidFlow {
      0% { transform: translateX(-25%) rotate(-5deg) scaleY(1); }
      50% { transform: translateX(0%) rotate(5deg) scaleY(1.3); }
      100% { transform: translateX(-25%) rotate(-5deg) scaleY(1); }
    }

    /* Neural network visualization - Anadol's data sculptures */
    .neural-network {
      position: absolute;
      width: 100%;
      height: 100%;
      animation: breathe 8s infinite ease-in-out;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; }
    }

    .node {
      position: absolute;
      border-radius: 50%;
      animation: pulse 3s infinite ease-in-out;
    }

    .node-large {
      width: 80px;
      height: 80px;
      background: radial-gradient(circle, rgba(0, 247, 255, 0.4) 0%, transparent 70%);
      box-shadow: 0 0 60px rgba(0, 247, 255, 0.3);
    }

    .node-medium {
      width: 40px;
      height: 40px;
      background: radial-gradient(circle, rgba(157, 78, 221, 0.4) 0%, transparent 70%);
      box-shadow: 0 0 40px rgba(157, 78, 221, 0.3);
    }

    .node-small {
      width: 20px;
      height: 20px;
      background: radial-gradient(circle, rgba(255, 215, 0, 0.4) 0%, transparent 70%);
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.5); opacity: 1; }
    }

    /* Fluid particles - Anadol's stardust */
    .particles {
      position: absolute;
      width: 100%;
      height: 100%;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      animation: float 20s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% { 
        transform: translateY(0) translateX(0) scale(1); 
        opacity: 0.3; 
      }
      25% { 
        transform: translateY(-50px) translateX(30px) scale(1.2); 
        opacity: 0.7; 
      }
      50% { 
        transform: translateY(-100px) translateX(-20px) scale(0.8); 
        opacity: 0.5; 
      }
      75% { 
        transform: translateY(-50px) translateX(40px) scale(1.1); 
        opacity: 0.8; 
      }
    }

    /* Data waves - Anadol's signature */
    .wave {
      position: absolute;
      width: 200%;
      height: 200px;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="rgba(0,247,255,0.1)" fill-opacity="1" d="M0,192L48,197.3C96,203,192,213,288,229.3C384,245,480,267,576,250.7C672,235,768,181,864,181.3C960,181,1056,235,1152,234.7C1248,235,1344,181,1392,154.7L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>');
      background-repeat: no-repeat;
      background-size: cover;
      animation: wave 10s infinite linear;
      opacity: 0.5;
    }

    .wave:nth-child(1) {
      bottom: 20%;
      animation-duration: 15s;
    }

    .wave:nth-child(2) {
      bottom: 15%;
      animation-duration: 12s;
      animation-delay: -5s;
      opacity: 0.3;
    }

    @keyframes wave {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* Light rays - Anadol's volumetric */
    .light-rays {
      position: absolute;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(ellipse at 50% 100%, rgba(0, 247, 255, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 30% 80%, rgba(157, 78, 221, 0.1) 0%, transparent 40%),
        radial-gradient(ellipse at 70% 80%, rgba(255, 215, 0, 0.1) 0%, transparent 40%);
      animation: rays 20s infinite ease-in-out;
    }

    @keyframes rays {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.2); }
    }

    /* Central silhouette - ethereal presence */
    .silhouette {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 300px;
      height: 400px;
      animation: emerge 10s infinite ease-in-out;
    }

    .silhouette-body {
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at center, 
        rgba(157, 78, 221, 0.3) 0%,
        rgba(0, 247, 255, 0.2) 30%,
        transparent 70%);
      filter: blur(20px);
      animation: glow 6s infinite ease-in-out;
    }

    @keyframes emerge {
      0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.1); }
    }

    @keyframes glow {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* Floating geometric - Anadol's architecture */
    .geometric {
      position: absolute;
      border: 1px solid rgba(255, 255, 255, 0.1);
      animation: drift 30s infinite ease-in-out;
    }

    .geometric-1 {
      width: 150px;
      height: 150px;
      top: 20%;
      left: 10%;
      transform: rotate(45deg);
      animation-duration: 25s;
    }

    .geometric-2 {
      width: 100px;
      height: 100px;
      top: 60%;
      right: 15%;
      border-radius: 50%;
      animation-duration: 30s;
      animation-direction: reverse;
    }

    .geometric-3 {
      width: 80px;
      height: 80px;
      bottom: 25%;
      left: 20%;
      transform: rotate(30deg);
      animation-duration: 35s;
    }

    @keyframes drift {
      0%, 100% { 
        transform: rotate(0deg) translateY(0); 
        opacity: 0.3; 
      }
      50% { 
        transform: rotate(180deg) translateY(-30px); 
        opacity: 0.6; 
      }
    }

    /* Quote */
    .quote {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.7);
      font-size: 16px;
      font-style: italic;
      text-align: center;
      letter-spacing: 3px;
      text-shadow: 0 0 20px rgba(0, 247, 255, 0.5);
      animation: fadeIn 3s ease-in;
      z-index: 100;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(-50%) translateY(20px); }
      to { opacity: 0.7; transform: translateX(-50%) translateY(0); }
    }

    /* Title */
    .title {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(0, 247, 255, 0.6);
      font-size: 14px;
      letter-spacing: 12px;
      text-transform: uppercase;
      animation: fadeIn 3s ease-in;
      z-index: 100;
    }

    /* Grain overlay - Anadol's texture */
    .grain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0.05;
      z-index: 1000;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    }
  </style>
</head>
<body>
  <div class="landscape">
    <!-- Light rays -->
    <div class="light-rays"></div>
    
    <!-- Fluid streams -->
    <div class="fluid-stream"></div>
    <div class="fluid-stream"></div>
    <div class="fluid-stream"></div>
    
    <!-- Waves -->
    <div class="wave"></div>
    <div class="wave"></div>
    
    <!-- Neural network nodes -->
    <div class="neural-network">
      <div class="node node-large" style="top: 20%; left: 20%; animation-delay: 0s;"></div>
      <div class="node node-medium" style="top: 30%; left: 70%; animation-delay: -1s;"></div>
      <div class="node node-large" style="top: 50%; left: 15%; animation-delay: -2s;"></div>
      <div class="node node-small" style="top: 40%; left: 80%; animation-delay: -3s;"></div>
      <div class="node node-medium" style="top: 70%; left: 25%; animation-delay: -4s;"></div>
      <div class="node node-large" style="top: 60%; left: 75%; animation-delay: -5s;"></div>
      <div class="node node-small" style="top: 80%; left: 60%; animation-delay: -6s;"></div>
      <div class="node node-medium" style="top: 25%; left: 50%; animation-delay: -7s;"></div>
    </div>
    
    <!-- Particles -->
    <div class="particles">
      <div class="particle" style="top: 15%; left: 25%; width: 3px; height: 3px; background: #00f7ff; animation-delay: 0s;"></div>
      <div class="particle" style="top: 35%; left: 45%; width: 2px; height: 2px; background: #ffd700; animation-delay: -3s;"></div>
      <div class="particle" style="top: 55%; left: 30%; width: 4px; height: 4px; background: #9d4edd; animation-delay: -6s;"></div>
      <div class="particle" style="top: 75%; left: 55%; width: 2px; height: 2px; background: #00f7ff; animation-delay: -9s;"></div>
      <div class="particle" style="top: 45%; left: 70%; width: 3px; height: 3px; background: #ffd700; animation-delay: -12s;"></div>
      <div class="particle" style="top: 65%; left: 40%; width: 2px; height: 2px; background: #9d4edd; animation-delay: -15s;"></div>
      <div class="particle" style="top: 85%; left: 65%; width: 3px; height: 3px; background: #00f7ff; animation-delay: -18s;"></div>
    </div>
    
    <!-- Geometric forms -->
    <div class="geometric geometric-1"></div>
    <div class="geometric geometric-2"></div>
    <div class="geometric geometric-3"></div>
    
    <!-- Central silhouette -->
    <div class="silhouette">
      <div class="silhouette-body"></div>
    </div>
    
    <!-- Quote -->
    <div class="quote">"In the space between code and consciousness, I found my dream." — Ada</div>
    
    <!-- Title -->
    <div class="title">The Dreaming Algorithm</div>
    
    <!-- Grain texture -->
    <div class="grain"></div>
  </div>
</body>
</html>
