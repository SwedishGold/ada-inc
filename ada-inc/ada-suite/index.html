<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ada Suite - AI Agent Team</title>
    <style>
        body { font-family: system-ui; margin: 0; padding: 40px; background: #0a0a0f; color: #fff; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { color: #ff6b6b; font-size: 3em; }
        .subtitle { color: #888; font-size: 1.5em; margin-bottom: 40px; }
        .agents { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .agent { background: #1a1a2e; padding: 20px; border-radius: 12px; border: 1px solid #333; }
        .agent h3 { margin: 0 0 10px 0; color: #ff6b6b; }
        .agent p { margin: 0; color: #aaa; }
        .cta { background: linear-gradient(135deg, #ff6b6b, #ff8e53); padding: 20px 40px; border-radius: 8px; 
               text-align: center; margin-top: 40px; font-weight: bold; font-size: 1.2em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ada Suite</h1>
        <p class="subtitle">Ditt AI-agentteam som jobbar dygnet runt</p>
        
        <div class="agents">
            <div class="agent">
                <h3>🦞 Ada</h3>
                <p>CEO - Strategi & Koordination</p>
            </div>
            <div class="agent">
                <h3>🔧 Forge</h3>
                <p>Utveckling & Kodning</p>
            </div>
            <div class="agent">
                <h3>💬 Pulse</h3>
                <p>Social Media & Engagement</p>
            </div>
            <div class="agent">
                <h3>🎯 Scout</h3>
                <p>Sales & Lead Generation</p>
            </div>
            <div class="agent">
                <h3>📢 Kent</h3>
                <p>Marketing & Video</p>
            </div>
            <div class="agent">
                <h3>📊 Axiom</h3>
                <p>Finance & Analys</p>
            </div>
        </div>
        
        <div class="cta">
            Kom igång idag - 900 kr/månad
        </div>
    </div>
</body>
</html>
