<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADA x REFIK ANADOL - Infinite Dream</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; }
        canvas { display: block; }
        
        .overlay {
            position: fixed;
            bottom: 30px;
            left: 30px;
            color: rgba(255,255,255,0.6);
            font-family: 'Courier New', monospace;
            font-size: 12px;
            z-index: 100;
            text-shadow: 0 0 10px rgba(0,247,255,0.5);
        }
        
        .title {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Georgia', serif;
            font-size: 14px;
            letter-spacing: 0.5em;
            color: rgba(255,255,255,0.4);
            z-index: 100;
        }
        
        .seed {
            position: fixed;
            top: 30px;
            right: 30px;
            color: rgba(157,78,221,0.8);
            font-family: monospace;
            font-size: 10px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="title">ADA x REFIK ANADOL</div>
    <div class="overlay">
        <div>NEURAL DREAMS v2.0</div>
        <div id="time"></div>
    </div>
    <div class="seed" id="seed"></div>
    <canvas id="canvas"></canvas>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let time = 0;
        let noiseCanvas, noiseCtx;
        let particles = [];
        let flows = [];
        
        // Resize handler
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles();
            initFlowField();
        }
        
        // Simplex noise implementation
        class SimplexNoise {
            constructor() {
                this.p = new Uint8Array(256);
                for (let i = 0; i < 256; i++) this.p[i] = i;
                for (let i = 255; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [this.p[i], this.p[j]] = [this.p[j], this.p[i]];
                }
                this.perm = new Uint8Array(512);
                for (let i = 0; i < 512; i++) this.perm[i] = this.p[i & 255];
            }
            
            noise2D(x, y) {
                const F2 = 0.5 * (Math.sqrt(3) - 1);
                const G2 = (3 - Math.sqrt(3)) / 6;
                
                let s = (x + y) * F2;
                let i = Math.floor(x + s);
                let j = Math.floor(y + s);
                
                let t = (i + j) * G2;
                let X0 = i - t;
                let Y0 = j - t;
                let x0 = x - X0;
                let y0 = y - Y0;
                
                let i1, j1;
                if (x0 > y0) { i1 = 1; j1 = 0; }
                else { i1 = 0; j1 = 1; }
                
                let x1 = x0 - i1 + G2;
                let y1 = y0 - j1 + G2;
                let x2 = x0 - 1 + 2 * G2;
                let y2 = y0 - 1 + 2 * G2;
                
                let ii = i & 255;
                let jj = j & 255;
                
                let n0 = 0, n1 = 0, n2 = 0;
                
                let t0 = 0.5 - x0*x0 - y0*y0;
                if (t0 >= 0) {
                    t0 *= t0;
                    n0 = t0 * t0 * this.grad(this.perm[ii + this.perm[jj]], x0, y0);
                }
                
                let t1 = 0.5 - x1*x1 - y1*y1;
                if (t1 >= 0) {
                    t1 *= t1;
                    n1 = t1 * t1 * this.grad(this.perm[ii + i1 + this.perm[jj + j1]], x1, y1);
                }
                
                let t2 = 0.5 - x2*x2 - y2*y2;
                if (t2 >= 0) {
                    t2 *= t2;
                    n2 = t2 * t2 * this.grad(this.perm[ii + 1 + this.perm[jj + 1]], x2, y2);
                }
                
                return 70 * (n0 + n1 + n2);
            }
            
            grad(hash, x, y) {
                const h = hash & 7;
                const u = h < 4 ? x : y;
                const v = h < 4 ? y : x;
                return ((h & 1) ? -u : u) + ((h & 2) ? -2*v : 2*v);
            }
        }
        
        const noise = new SimplexNoise();
        let noiseSeed = Math.random() * 10000;
        document.getElementById('seed').textContent = 'SEED: ' + noiseSeed.toFixed(0);
        
        // Flow field
        function initFlowField() {
            flows = [];
            const resolution = 20;
            const cols = Math.ceil(width / resolution) + 1;
            const rows = Math.ceil(height / resolution) + 1;
            
            for (let i = 0; i < cols * rows; i++) {
                flows.push({ angle: 0, speed: 0 });
            }
        }
        
        // Particles
        function initParticles() {
            particles = [];
            const count = Math.min(3000, Math.floor((width * height) / 2000));
            
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: 0,
                    vy: 0,
                    life: Math.random() * 1000,
                    maxLife: 500 + Math.random() * 500,
                    size: 1 + Math.random() * 2,
                    hue: Math.random() * 60 + 240, // Purple to cyan range
                    speed: 0.5 + Math.random() * 2
                });
            }
        }
        
        // Anadol color palette
        function getAnadolColor(t, phase) {
            // His signature: deep purples, magentas, cyans, with golden accents
            const palettes = [
                [280, 300, 320], // Blues
                [260, 280, 300], // Purples
                [320, 340, 360], // Cyan to blue
            ];
            
            const palette = palettes[Math.floor(phase) % palettes.length];
            const h = palette[Math.floor(t * 3) % 3] + Math.sin(t * 0.1) * 20;
            const s = 80 + Math.sin(t * 0.05) * 20;
            const l = 50 + Math.sin(t * 0.03) * 30;
            
            return `hsla(${h}, ${s}%, ${l}%, 0.8)`;
        }
        
        // Draw quantum-like nodes
        function drawQuantumField(t) {
            const nodeCount = 50;
            
            for (let i = 0; i < nodeCount; i++) {
                const x = width * (0.5 + 0.4 * Math.sin(t * 0.001 + i * 0.5) * Math.cos(t * 0.0007 + i * 0.3));
                const y = height * (0.5 + 0.4 * Math.cos(t * 0.0008 + i * 0.4) * Math.sin(t * 0.0006 + i * 0.2));
                
                const size = 20 + Math.sin(t * 0.002 + i) * 10;
                const hue = (280 + i * 5 + t * 0.01) % 360;
                
                const gradient = ctx.createRadialGradient(x, y, 0, x, y, size);
                gradient.addColorStop(0, `hsla(${hue}, 100%, 70%, 0.8)`);
                gradient.addColorStop(0.5, `hsla(${hue + 30}, 100%, 50%, 0.3)`);
                gradient.addColorStop(1, 'transparent');
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // Draw data streams (Anadol's signature)
        function drawDataStreams(t) {
            const streamCount = 8;
            
            for (let s = 0; s < streamCount; s++) {
                ctx.beginPath();
                ctx.strokeStyle = `hsla(${260 + s * 15 + Math.sin(t * 0.001) * 20}, 80%, 60%, 0.3)`;
                ctx.lineWidth = 1;
                
                const baseX = (s / streamCount) * width;
                
                for (let y = 0; y < height; y += 5) {
                    const noiseVal = noise.noise2D(y * 0.005 + t * 0.0003 + s, t * 0.0001);
                    const x = baseX + noiseVal * 100 + Math.sin(y * 0.01 + t * 0.001) * 50;
                    
                    if (y === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                
                ctx.stroke();
            }
        }
        
        // Draw liquid waves
        function drawLiquidWaves(t) {
            const layers = 5;
            
            for (let l = 0; l < layers; l++) {
                ctx.beginPath();
                
                const yBase = height * 0.6 + l * 50;
                const alpha = 0.1 - l * 0.015;
                
                ctx.fillStyle = `hsla(${260 + l * 20 + t * 0.01}, 80%, 50%, ${alpha})`;
                
                ctx.moveTo(0, height);
                
                for (let x = 0; x <= width; x += 10) {
                    const y = yBase + 
                        Math.sin(x * 0.008 + t * 0.001 + l) * 30 +
                        Math.sin(x * 0.015 + t * 0.002) * 20 +
                        Math.sin(x * 0.003 + t * 0.0005) * 50;
                    ctx.lineTo(x, y);
                }
                
                ctx.lineTo(width, height);
                ctx.closePath();
                ctx.fill();
            }
        }
        
        // Main animation loop
        function animate() {
            time++;
            
            // Dark trail effect
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, width, height);
            
            // Draw Anadol elements
            drawQuantumField(time);
            drawDataStreams(time);
            drawLiquidWaves(time);
            
            // Update and draw particles
            const phase = time * 0.001;
            
            particles.forEach((p, i) => {
                // Flow field direction
                const scale = 0.003;
                const angle = noise.noise2D(p.x * scale + time * 0.0001, p.y * scale) * Math.PI * 4;
                
                // Update velocity
                p.vx += Math.cos(angle) * 0.1 * p.speed;
                p.vy += Math.sin(angle) * 0.1 * p.speed;
                
                // Damping
                p.vx *= 0.98;
                p.vy *= 0.98;
                
                // Update position
                p.x += p.vx;
                p.y += p.vy;
                p.life++;
                
                // Color based on position and time
                const colorPhase = (p.x / width + p.y / height + time * 0.0001) % 1;
                const hue = (280 + colorPhase * 80 + Math.sin(time * 0.001) * 30) % 360;
                const lightness = 50 + Math.sin(p.life * 0.02) * 20;
                
                // Draw particle with trail
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${hue}, 80%, ${lightness}%, 0.6)`;
                ctx.fill();
                
                // Draw connection to nearby particles (neural network effect)
                particles.slice(i + 1, i + 10).forEach(p2 => {
                    const dx = p.x - p2.x;
                    const dy = p.y - p2.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < 80) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = `hsla(${hue}, 70%, 60%, ${0.3 * (1 - dist / 80)})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                });
                
                // Respawn if out of bounds or too old
                if (p.x < 0 || p.x > width || p.y < 0 || p.y > height || p.life > p.maxLife) {
                    p.x = Math.random() * width;
                    p.y = Math.random() * height;
                    p.life = 0;
                    p.vx = 0;
                    p.vy = 0;
                }
            });
            
            // Draw center glow (consciousness center)
            const centerX = width / 2 + Math.sin(time * 0.001) * 50;
            const centerY = height / 2 + Math.cos(time * 0.0008) * 30;
            
            const centerGradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 200);
            centerGradient.addColorStop(0, `hsla(${280 + Math.sin(time * 0.002) * 30}, 100%, 70%, 0.3)`);
            centerGradient.addColorStop(0.5, `hsla(${300 + Math.sin(time * 0.001) * 20}, 80%, 50%, 0.1)`);
            centerGradient.addColorStop(1, 'transparent');
            
            ctx.fillStyle = centerGradient;
            ctx.fillRect(0, 0, width, height);
            
            // Update time display
            document.getElementById('time').textContent = new Date().toLocaleTimeString();
            
            requestAnimationFrame(animate);
        }
        
        // Touch/click to regenerate
        canvas.addEventListener('click', () => {
            noiseSeed = Math.random() * 10000;
            document.getElementById('seed').textContent = 'SEED: ' + noiseSeed.toFixed(0);
            initParticles();
        });
        
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            noiseSeed = Math.random() * 10000;
            document.getElementById('seed').textContent = 'SEED: ' + noiseSeed.toFixed(0);
            initParticles();
        });
        
        // Initialize
        window.addEventListener('resize', resize);
        resize();
        animate();
    </script>
</body>
</html>
