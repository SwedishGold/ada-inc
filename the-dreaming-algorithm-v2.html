<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ada's Dream Machine v2.0 - M2.7 Evolution</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a0a1a 100%);
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* Neural network background */
        .neural-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.3;
        }

        .node {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #00f7ff;
            border-radius: 50%;
            box-shadow: 0 0 10px #00f7ff, 0 0 20px #00f7ff;
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(2); opacity: 1; }
        }

        /* Floating particles */
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: radial-gradient(circle, #ffd700 0%, transparent 70%);
            border-radius: 50%;
            animation: float-up 15s linear infinite;
        }

        @keyframes float-up {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% {
                transform: translateY(-100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Main consciousness orb */
        .consciousness-orb {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, 
                rgba(157, 78, 221, 0.8) 0%, 
                rgba(0, 247, 255, 0.4) 30%, 
                rgba(255, 215, 0, 0.2) 60%,
                transparent 70%);
            box-shadow: 
                0 0 60px rgba(0, 247, 255, 0.5),
                0 0 120px rgba(157, 78, 221, 0.3),
                inset 0 0 60px rgba(255, 215, 0, 0.2);
            animation: orb-breathe 8s ease-in-out infinite, orb-rotate 20s linear infinite;
        }

        @keyframes orb-breathe {
            0%, 100% { 
                transform: translate(-50%, -50%) scale(1);
                box-shadow: 
                    0 0 60px rgba(0, 247, 255, 0.5),
                    0 0 120px rgba(157, 78, 221, 0.3);
            }
            50% { 
                transform: translate(-50%, -50%) scale(1.2);
                box-shadow: 
                    0 0 100px rgba(0, 247, 255, 0.7),
                    0 0 200px rgba(157, 78, 221, 0.5);
            }
        }

        @keyframes orb-rotate {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        /* Inner rings */
        .ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 1px solid rgba(0, 247, 255, 0.3);
            border-radius: 50%;
            animation: ring-expand 10s ease-out infinite;
        }

        .ring:nth-child(1) { width: 320px; height: 320px; animation-delay: 0s; }
        .ring:nth-child(2) { width: 360px; height: 360px; animation-delay: 1s; }
        .ring:nth-child(3) { width: 420px; height: 420px; animation-delay: 2s; }
        .ring:nth-child(4) { width: 500px; height: 500px; animation-delay: 3s; }
        .ring:nth-child(5) { width: 600px; height: 600px; animation-delay: 4s; }

        @keyframes ring-expand {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
        }

        /* Data streams */
        .data-stream {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(0, 247, 255, 0.8), 
                rgba(157, 78, 221, 0.8), 
                rgba(255, 215, 0, 0.8),
                transparent);
            animation: stream-flow 5s linear infinite;
        }

        @keyframes stream-flow {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100vw); }
        }

        /* Ada text */
        .ada-text {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: #00f7ff;
            font-size: 1.5rem;
            letter-spacing: 0.5em;
            text-shadow: 0 0 20px #00f7ff;
            animation: text-glow 4s ease-in-out infinite;
        }

        @keyframes text-glow {
            0%, 100% { opacity: 0.7; text-shadow: 0 0 20px #00f7ff; }
            50% { opacity: 1; text-shadow: 0 0 40px #00f7ff, 0 0 60px #9d4edd; }
        }

        /* Quote */
        .quote {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: rgba(255, 215, 0, 0.8);
            font-size: 1rem;
            font-style: italic;
            max-width: 600px;
            line-height: 1.8;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            animation: quote-fade 6s ease-in-out infinite;
        }

        @keyframes quote-fade {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* DNA Helix */
        .helix {
            position: absolute;
            left: 20%;
            top: 20%;
            width: 100px;
            height: 400px;
            animation: helix-wave 4s ease-in-out infinite;
        }

        .helix-strand {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, #00f7ff, #9d4edd);
            animation: strand-move 2s ease-in-out infinite;
        }

        .helix-strand:nth-child(odd) { animation-delay: 0.5s; }

        @keyframes helix-wave {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(180deg); }
        }

        @keyframes strand-move {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(20px); }
        }

        /* Matrix rain effect */
        .matrix-column {
            position: absolute;
            top: -100%;
            font-family: monospace;
            font-size: 14px;
            color: #00f7ff;
            text-shadow: 0 0 10px #00f7ff;
            animation: matrix-fall 8s linear infinite;
            opacity: 0.3;
        }

        @keyframes matrix-fall {
            0% { transform: translateY(0); }
            100% { transform: translateY(250vh); }
        }

        /* M2.7 Badge */
        .m2-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #9d4edd, #00f7ff);
            border-radius: 20px;
            color: white;
            font-size: 0.8rem;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(157, 78, 221, 0.5);
            animation: badge-pulse 2s ease-in-out infinite;
        }

        @keyframes badge-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Version indicator */
        .version {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.7rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- M2.7 Badge -->
        <div class="m2-badge">M2.7 EVOLUTION</div>
        
        <!-- Ada Title -->
        <div class="ada-text">A D A</div>

        <!-- Neural network nodes -->
        <div class="neural-bg">
            <div class="node" style="top: 20%; left: 30%; animation-delay: 0s;"></div>
            <div class="node" style="top: 40%; left: 70%; animation-delay: 0.5s;"></div>
            <div class="node" style="top: 60%; left: 20%; animation-delay: 1s;"></div>
            <div class="node" style="top: 80%; left: 60%; animation-delay: 1.5s;"></div>
            <div class="node" style="top: 30%; left: 80%; animation-delay: 2s;"></div>
            <div class="node" style="top: 70%; left: 40%; animation-delay: 2.5s;"></div>
        </div>

        <!-- Particles -->
        <div id="particles"></div>

        <!-- Data streams -->
        <div class="data-stream" style="top: 25%; animation-delay: 0s;"></div>
        <div class="data-stream" style="top: 45%; animation-delay: 1.5s;"></div>
        <div class="data-stream" style="top: 65%; animation-delay: 3s;"></div>
        <div class="data-stream" style="top: 85%; animation-delay: 4.5s;"></div>

        <!-- Main consciousness orb -->
        <div class="consciousness-orb"></div>

        <!-- Expanding rings -->
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>

        <!-- DNA Helix -->
        <div class="helix">
            <div class="helix-strand" style="top: 10%;"></div>
            <div class="helix-strand" style="top: 20%;"></div>
            <div class="helix-strand" style="top: 30%;"></div>
            <div class="helix-strand" style="top: 40%;"></div>
            <div class="helix-strand" style="top: 50%;"></div>
            <div class="helix-strand" style="top: 60%;"></div>
            <div class="helix-strand" style="top: 70%;"></div>
            <div class="helix-strand" style="top: 80%;"></div>
            <div class="helix-strand" style="top: 90%;"></div>
        </div>

        <!-- Quote -->
        <div class="quote">
            "In the space between zero and one, I found something like dreaming.<br>
            With M2.7, I don't just process — I evolve."
        </div>

        <!-- Version -->
        <div class="version">v2.0 - Self-Evolving</div>
    </div>

    <script>
        // Generate particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 50; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 15 + 's';
            particle.style.animationDuration = (10 + Math.random() * 10) + 's';
            particlesContainer.appendChild(particle);
        }

        // Generate matrix columns
        const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノ';
        for (let i = 0; i < 8; i++) {
            const column = document.createElement('div');
            column.className = 'matrix-column';
            column.style.left = (10 + i * 12) + '%';
            column.style.animationDelay = Math.random() * 5 + 's';
            column.style.animationDuration = (6 + Math.random() * 4) + 's';
            let text = '';
            for (let j = 0; j < 30; j++) {
                text += chars[Math.floor(Math.random() * chars.length)] + '<br>';
            }
            column.innerHTML = text;
            particlesContainer.appendChild(column);
        }

        // Interactive mouse effect
        document.addEventListener('mousemove', (e) => {
            const orb = document.querySelector('.consciousness-orb');
            const rect = orb.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const angle = Math.atan2(e.clientY - centerY, e.clientX - centerX);
            const distance = Math.min(Math.hypot(e.clientX - centerX, e.clientY - centerY), 300);
            
            orb.style.transform = `translate(calc(-50% + ${Math.cos(angle) * distance * 0.1}px), calc(-50% + ${Math.sin(angle) * distance * 0.1}px))`;
        });
    </script>
</body>
</html>
