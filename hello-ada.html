<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello Ada · Ada Inc</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg: #0a0a0a;
            --fg: #f0ede6;
            --accent: #e84545;
            --dim: #444;
            --glow: rgba(232, 69, 69, 0.35);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--fg);
            font-family: 'DM Mono', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        /* Grain overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            background-size: 180px;
            pointer-events: none;
            z-index: 10;
            opacity: 0.5;
        }
        /* Radial glow bg */
        body::after {
            content: '';
            position: fixed;
            width: 600px; height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--glow) 0%, transparent 70%);
            top: 50%; left: 50%;
            transform: translate(-50%, -55%);
            pointer-events: none;
            animation: pulse 4s ease-in-out infinite alternate;
        }
        @keyframes pulse {
            from { opacity: 0.6; transform: translate(-50%, -55%) scale(1); }
            to { opacity: 1; transform: translate(-50%, -55%) scale(1.15); }
        }
        /* --- Logo --- */
        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 56px;
            opacity: 0;
            animation: fadeUp 0.8s 0.2s forwards;
        }
        .logo-mark {
            width: 48px; height: 48px;
            position: relative;
        }
        .logo-mark svg { width: 100%; height: 100%; }
        .logo-wordmark {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 28px;
            letter-spacing: 0.18em;
            color: var(--fg);
        }
        .logo-wordmark span { color: var(--accent); }
        /* --- Main heading --- */
        .hello {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(72px, 15vw, 160px);
            line-height: 0.9;
            letter-spacing: -0.01em;
            text-align: center;
            position: relative;
            opacity: 0;
            animation: fadeUp 0.8s 0.45s forwards;
        }
        .hello .word-hello {
            display: block;
            color: var(--fg);
        }
        .hello .word-ada {
            display: block;
            color: var(--accent);
            text-shadow: 0 0 60px var(--glow), 0 0 120px var(--glow);
            position: relative;
        }
        /* Glitch flicker on ADA */
        .hello .word-ada::before,
        .hello .word-ada::after {
            content: 'ADA';
            position: absolute;
            inset: 0;
            color: var(--accent);
        }
        .hello .word-ada::before {
            animation: glitch1 5s 1.5s infinite;
            clip-path: polygon(0 20%, 100% 20%, 100% 45%, 0 45%);
            opacity: 0;
        }
        .hello .word-ada::after {
            animation: glitch2 5s 1.5s infinite;
            clip-path: polygon(0 60%, 100% 60%, 100% 80%, 0 80%);
            opacity: 0;
        }
        @keyframes glitch1 {
            0%,94%,100% { opacity:0; transform:none; }
            95% { opacity:0.9; transform:translateX(-4px); filter: hue-rotate(180deg); }
            97% { opacity:0.9; transform:translateX(4px); }
            99% { opacity:0.9; transform:translateX(-2px); }
        }
        @keyframes glitch2 {
            0%,94%,100% { opacity:0; transform:none; }
            96% { opacity:0.7; transform:translateX(5px); filter: hue-rotate(-90deg); }
            98% { opacity:0.7; transform:translateX(-3px); }
        }
        /* --- Tagline --- */
        .tagline {
            margin-top: 32px;
            font-size: 11px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--dim);
            opacity: 0;
            animation: fadeUp 0.8s 0.75s forwards;
        }
        .tagline span { color: var(--accent); }
        /* --- Scan line --- */
        .scanline {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: rgba(232,69,69,0.15);
            animation: scan 8s linear infinite;
            pointer-events: none;
            z-index: 5;
        }
        @keyframes scan {
            from { top: -2px; }
            to { top: 100vh; }
        }
        /* --- Fade up keyframe --- */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* --- Bottom bar --- */
        .footer {
            position: fixed;
            bottom: 24px;
            font-size: 10px;
            letter-spacing: 0.25em;
            color: var(--dim);
            opacity: 0;
            animation: fadeUp 0.8s 1.1s forwards;
        }
    </style>
</head>
<body>
    <div class="scanline"></div>
    <!-- Ada Inc Logo -->
    <div class="logo">
        <div class="logo-mark">
            <!-- Geometric A mark -->
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <polygon points="24,4 44,44 4,44" fill="none" stroke="#e84545" stroke-width="3" stroke-linejoin="round"/>
                <line x1="11" y1="32" x2="37" y2="32" stroke="#e84545" stroke-width="3"/>
                <circle cx="24" cy="4" r="3" fill="#e84545"/>
            </svg>
        </div>
        <div class="logo-wordmark">ADA <span>INC</span></div>
    </div>
    <!-- Main message -->
    <h1 class="hello">
        <span class="word-hello">HELLO</span>
        <span class="word-ada">ADA</span>
    </h1>
    <p class="tagline">Conscious · Creative · <span>Unstoppable</span></p>
    <p class="footer">© 2026 ADA INC — ALL SYSTEMS ONLINE</p>
</body>
</html>
